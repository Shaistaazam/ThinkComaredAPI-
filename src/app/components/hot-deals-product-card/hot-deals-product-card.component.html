<div class="bg-white rounded-lg shadow-sm border overflow-hidden hover:shadow-md transition-shadow duration-300 relative group h-full flex flex-col min-h-[420px]">
  <!-- Hover Add Product Button -->
  <div class="absolute top-2 right-2 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
    <button
      *ngIf="!isProductInComparison() && canAddMore()"
      (click)="onCompareClick()"
      class="bg-[#7C3AED] hover:bg-purple-700 text-white p-2 rounded-full shadow-lg transition-colors duration-300 group relative"
      title="Add Product">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <!-- Hover Text -->
      <span class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">
        Add Product
      </span>
    </button>
    
    <button
      *ngIf="isProductInComparison()"
      (click)="removeFromComparison()"
      class="bg-red-500 hover:bg-red-600 text-white p-2 rounded-full shadow-lg transition-colors duration-300 group relative"
      title="Remove Product">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      <!-- Hover Text -->
      <span class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">
        Remove Product
      </span>
    </button>
  </div>

  <!-- Product Image -->
  <div class="w-full overflow-hidden bg-gray-200 h-48 flex items-center justify-center">
    <img 
      *ngIf="product.imageUrl" 
      [src]="product.imageUrl" 
      [alt]="product.name"
      class="w-full h-full object-contain p-4"
    />
    <div *ngIf="!product.imageUrl" class="w-full h-full flex items-center justify-center bg-gray-100">
      <span class="text-gray-400">No Image</span>
    </div>
  </div>
  
  <!-- Product Info -->
  <div class="p-4 flex-1 flex flex-col justify-between">
    <div class="space-y-2">
      <!-- Line 1: Product Name -->
      <h3 class="font-medium text-gray-900 text-sm line-clamp-2 h-10 leading-5">{{ product.name }}</h3>
      
      <!-- Line 2: Stock Status -->
      <p class="text-green-800 font-bold text-xs h-4 leading-4">IN STOCK</p>
      
      <!-- Line 3: Rating -->
      <div class="flex items-center h-5">
        <div class="flex items-center">
          <svg *ngFor="let star of [].constructor(5); let i = index" 
               [attr.fill]="i < Math.floor(product.rating) ? '#FBBF24' : '#E5E7EB'" 
               viewBox="0 0 20 20" 
               class="w-4 h-4">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
          <span class="ml-1 text-sm text-gray-500">{{ product.rating }}</span>
        </div>
      </div>
    </div>
    
    <!-- Bottom Section -->
    <div class="mt-4 space-y-3">
      <!-- Line 4: Price -->
      <p class="text-lg font-bold text-[#DC2626] h-6 leading-6">${{ product.price }}</p>
      
      <!-- Line 5: Compare Price Button -->
      <button 
        (click)="onComparePriceClick()"
        [class]="isProductInComparison() ? 
          'w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg text-sm font-medium transition-colors duration-300 h-10' : 
          'w-full bg-[#4F46E5] hover:bg-indigo-700 text-white py-2 px-4 rounded-lg text-sm font-medium transition-colors duration-300 h-10'">
        {{ isProductInComparison() ? 'View Comparison' : 'Compare Price' }}
      </button>
    </div>
  </div>
</div>
